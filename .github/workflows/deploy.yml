name: Pulseo deployment safety gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type AUDIT_ONLY to run the safety gate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm audit-only mode
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          test "$CONFIRMATION" = "AUDIT_ONLY"
          echo "Deployment is intentionally locked."
          echo "Required before activation: canonical VPS import, Vault verification, sandbox redeploy, health check and rollback proof."

      - name: Verify repository contains no obvious secret files
        uses: actions/checkout@v4

      - name: Run repository safety checks
        run: |
          set -eu
          forbidden=$(find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa' \) -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo "Forbidden secret-like files detected:"
            echo "$forbidden"
            exit 1
          fi
          echo "Safety gate passed. No deployment was performed."
